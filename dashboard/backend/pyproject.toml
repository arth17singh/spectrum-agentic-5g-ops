[project]
name = "spectrum-backend"
version = "0.1.0"
description = "SPECTRUM console backend: mock simulation engine + AWS adapter seams"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "numpy>=2.0",
  "cryptography>=43",
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spectrum"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
